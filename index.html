<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>USM Student Runner 🚗💨 (Girls Only)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-pink-50 min-h-screen flex items-center justify-center p-3">

  <div class="bg-white max-w-md w-full rounded-3xl shadow-xl border-2 border-pink-200 overflow-hidden relative">
    
    <!-- Banner Header -->
    <div class="bg-gradient-to-r from-pink-500 via-purple-500 to-violet-600 p-6 text-white text-center">
      <span class="bg-white text-pink-600 text-[11px] font-black tracking-wider px-3 py-1 rounded-full uppercase inline-block mb-2 shadow">
        🌸 For Girls Only (Sis USM) 🌸
      </span>
      <h1 class="text-xl md:text-2xl font-extrabold tracking-tight">Student Runner & Cab 🚗💨 (for girls only)</h1>
      <p class="text-pink-100 text-xs mt-1 font-medium">Tak payah sewa Grab mahal-mahal, biar akak tolong! ✨</p>
    </div>

    <!-- Booking Form -->
    <form id="bookingForm" class="p-6 space-y-4">
      
      <!-- Status Box -->
      <div id="statusBox" class="hidden p-3 rounded-xl text-xs font-bold text-center"></div>

      <!-- Nama -->
      <div>
        <label class="text-xs font-bold uppercase text-slate-500">Nama Panggilan</label>
        <input type="text" id="name" required placeholder="cth: Sarah / Aina"
          class="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-pink-400 outline-none text-sm transition" />
      </div>

      <!-- No Phone -->
      <div>
        <label class="text-xs font-bold uppercase text-slate-500">No. WhatsApp</label>
        <input type="tel" id="phone" required placeholder="cth: 0134567890"
          class="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-pink-400 outline-none text-sm transition" />
      </div>

      <!-- Lokasi Pickup -->
      <div class="space-y-2">
        <label class="text-xs font-bold uppercase text-slate-500">Lokasi Pick-up</label>
        <select id="pickupArea" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-pink-400 outline-none text-sm font-semibold transition">
          <optgroup label="🏡 Kawasan RST (Luar Kampus)">
            <option value="rst">Desasiswa Restu</option>
            <option value="rst">Desasiswa Saujana</option>
            <option value="rst">Desasiswa Tekun</option>
          </optgroup>
          <optgroup label="🏫 Kampus Utama">
            <option value="kampus">Desasiswa Aman Damai</option>
            <option value="kampus">Desasiswa Bakti Permai</option>
            <option value="kampus">Desasiswa Cahaya Gemilang</option>
            <option value="kampus">Desasiswa Fajar Harapan</option>
            <option value="kampus">Desasiswa Indah Kembara</option>
            <option value="kampus">Pintu Sg Dua / Bumbung Putih</option>
            <option value="kampus">Lain-lain Kawasan Kampus</option>
          </optgroup>
        </select>
        <input type="text" id="pickupDetail" required placeholder="Detail tempat: cth: Foyer Blok B, Bilik 204"
          class="w-full p-3 bg-slate-50 border border-pink-100 rounded-2xl focus:ring-2 focus:ring-pink-400 outline-none text-xs transition" />
      </div>

      <!-- Destinasi -->
      <div>
        <label class="text-xs font-bold uppercase text-slate-500">Destinasi</label>
        <div class="grid grid-cols-2 gap-2 mt-1">
          <label class="cursor-pointer">
            <input type="radio" name="dest" value="MR.DIY Sg Dua" checked class="peer sr-only">
            <div class="p-3 text-center text-xs font-bold border-2 border-slate-100 rounded-2xl peer-checked:bg-pink-500 peer-checked:text-white peer-checked:border-pink-500 transition shadow-sm">
              🔨 MR.DIY Sg Dua
            </div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="dest" value="Mydin BJ" class="peer sr-only">
            <div class="p-3 text-center text-xs font-bold border-2 border-slate-100 rounded-2xl peer-checked:bg-pink-500 peer-checked:text-white peer-checked:border-pink-500 transition shadow-sm">
              🛍️ Mydin BJ
            </div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="dest" value="Eco-Shop RM2.40" class="peer sr-only">
            <div class="p-3 text-center text-xs font-bold border-2 border-slate-100 rounded-2xl peer-checked:bg-pink-500 peer-checked:text-white peer-checked:border-pink-500 transition shadow-sm">
              🟢 Eco-Shop RM2.40
            </div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="dest" value="Lotus's Sg Dua" class="peer sr-only">
            <div class="p-3 text-center text-xs font-bold border-2 border-slate-100 rounded-2xl peer-checked:bg-pink-500 peer-checked:text-white peer-checked:border-pink-500 transition shadow-sm">
              🛒 Lotus's Sg Dua
            </div>
          </label>
        </div>
      </div>

      <!-- ⭐ TARIKH PICK-UP / SERVIS (BARU DITAMBAH) ⭐ -->
      <div>
        <label class="text-xs font-bold uppercase text-slate-500">Tarikh Pick-up / Servis</label>
        <input type="date" id="pickupDate" required
          class="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-pink-400 outline-none text-sm font-semibold text-slate-700 transition" />
      </div>

      <!-- Slot Masa -->
      <div>
        <label class="text-xs font-bold uppercase text-slate-500">Pilih Slot Masa</label>
        <div class="grid grid-cols-2 gap-2 mt-1">
          <label class="cursor-pointer">
            <input type="radio" name="slot" value="5:00 PM" checked class="peer sr-only">
            <div class="p-3 text-center text-xs font-extrabold border-2 border-slate-100 rounded-2xl peer-checked:bg-amber-300 peer-checked:border-amber-300 peer-checked:text-slate-900 transition">
              ☀️ 5:00 PM
            </div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="slot" value="8:00 PM" class="peer sr-only">
            <div class="p-3 text-center text-xs font-extrabold border-2 border-slate-100 rounded-2xl peer-checked:bg-amber-300 peer-checked:border-amber-300 peer-checked:text-slate-900 transition">
              🌙 8:00 PM
            </div>
          </label>
        </div>
      </div>

      <!-- Tambang Box -->
      <div class="bg-pink-50 p-4 rounded-2xl flex justify-between items-center border border-pink-200">
        <div>
          <span class="text-slate-500 text-xs block">Tambang Jimat Sis:</span>
          <span class="text-[11px] text-pink-600 font-semibold">Jimat RM1 - RM2 ikut jarak ✨</span>
        </div>
        <span id="priceTag" class="text-2xl font-black text-pink-600">RM 4.00</span>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" class="w-full py-4 bg-pink-500 hover:bg-pink-600 active:scale-[0.98] text-white font-extrabold rounded-2xl shadow-lg shadow-pink-200 transition">
        Hantar Tempahan ke WhatsApp 💬
      </button>
    </form>
  </div>

  <script>
    // ✅ NOMBOR WHATSAPP ANDA YANG SEBENAR
    const MY_PHONE = "601123701040";

    // ⚠️ CONFIG FIREBASE ANDA
    const firebaseConfig = {
      apiKey: "AIzaSyASwPzf_3NND5f4NbIHC6llEIMnRiSOz_s",
      authDomain: "usm-runner-cab.firebaseapp.com",
      projectId: "usm-runner-cab",
      storageBucket: "usm-runner-cab.firebasestorage.app",
      messagingSenderId: "611460068015",
      appId: "1:611460068015:web:4295ab4950a63a8950da5a"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.firestore();

    const priceTag = document.getElementById('priceTag');
    const pickupArea = document.getElementById('pickupArea');
    const form = document.getElementById('bookingForm');
    const submitBtn = document.getElementById('submitBtn');
    const statusBox = document.getElementById('statusBox');
    const dateInput = document.getElementById('pickupDate');

    // Setkan nilai default tarikh kepada hari ini & sekat tarikh lepas
    const today = new Date().toISOString().split('T')[0];
    dateInput.min = today;
    dateInput.value = today;

    function calculatePrice() {
      const area = pickupArea.value;
      const dest = document.querySelector('input[name="dest"]:checked').value;
      let price = (dest.includes('DIY') || dest.includes('Lotus')) 
        ? (area === 'rst' ? 5 : 4) 
        : (area === 'rst' ? 6 : 5);
      priceTag.innerText = `RM ${price}.00`;
      return price;
    }

    pickupArea.addEventListener('change', calculatePrice);
    document.querySelectorAll('input[name="dest"]').forEach(el => el.addEventListener('change', calculatePrice));

    // SUBMIT & DIRECT WHATSAPP REDIRECT
    form.addEventListener('submit', async function(e) {
      e.preventDefault();

      submitBtn.innerText = "Memproses Tempahan... ⏳";
      submitBtn.disabled = true;

      const name = document.getElementById('name').value;
      const phone = document.getElementById('phone').value;
      const rawDate = dateInput.value; // cth: 2026-09-12
      
      // Tukar format tarikh kepada format mudah dibaca (DD/MM/YYYY)
      const [year, month, day] = rawDate.split('-');
      const formattedDate = `${day}/${month}/${year}`;

      const pickupPlace = `${pickupArea.selectedOptions[0].text} - ${document.getElementById('pickupDetail').value}`;
      const dest = document.querySelector('input[name="dest"]:checked').value;
      const slot = document.querySelector('input[name="slot"]:checked').value;
      const fare = calculatePrice();

      // Format mesej WhatsApp (Ditambah baris Tarikh)
      const msg = `Hai Sis Runner USM! 🌸%0A%0ASaya nak book servis cab/runner:%0A👤 *Nama:* ${encodeURIComponent(name)}%0A📱 *No Tel:* ${encodeURIComponent(phone)}%0A📅 *Tarikh Pick-up:* ${encodeURIComponent(formattedDate)}%0A📍 *Pick-up:* ${encodeURIComponent(pickupPlace)}%0A🛍️ *Destinasi:* ${encodeURIComponent(dest)}%0A⏰ *Slot Masa:* ${encodeURIComponent(slot)}%0A💰 *Tambang:* RM ${fare}`;
      const waURL = `https://wa.me/${MY_PHONE}?text=${msg}`;

      // 1. Simpan ke Firestore (Termasuk field 'date')
      try {
        await db.collection("bookings").add({
          name: name,
          phone: phone,
          date: formattedDate,
          rawDate: rawDate,
          pickup: pickupPlace,
          destination: dest,
          slot: slot,
          fare: `RM ${fare}`,
          isTaken: false,
          takenNotes: "",
          status: "Pending",
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        console.log("Data berjaya masuk ke Firestore!");
      } catch (err) {
        console.error("Firestore error:", err);
      }

      // 2. Terus buka WhatsApp
      statusBox.className = "p-3 rounded-xl text-xs font-bold text-center bg-emerald-100 text-emerald-800 block mb-2";
      statusBox.innerHTML = "Tempahan Diterima! Sedang membuka WhatsApp anda...";

      setTimeout(() => {
        window.location.href = waURL;
      }, 700);
    });

    calculatePrice();
  </script>
</body>
</html>
