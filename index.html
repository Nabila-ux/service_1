<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>USM Student Runner 🚗💨 (Girls Only)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-pink-50 min-h-screen flex items-center justify-center p-3">

  <div class="bg-white max-w-md w-full rounded-3xl shadow-xl border-2 border-pink-200 overflow-hidden">
    
    <!-- 🌸 Banner Header Baharu -->
    <div class="bg-gradient-to-r from-pink-500 via-purple-500 to-violet-600 p-6 text-white text-center">
      <span class="bg-white text-pink-600 text-[11px] font-black tracking-wider px-3 py-1 rounded-full uppercase inline-block mb-2 shadow">
        🌸 For Girls Only (Sis USM) 🌸
      </span>
      <!-- PERUBAHAN 3: Tajuk Baharu -->
      <h1 class="text-xl md:text-2xl font-extrabold tracking-tight">Student Runner & Cab 🚗💨 (for girls only)</h1>
      <!-- PERUBAHAN 2: Tagline Baharu -->
      <p class="text-pink-100 text-xs mt-1 font-medium">Tak payah sewa Grab mahal-mahal, biar akak tolong! ✨</p>
    </div>

    <!-- Booking Form -->
    <form id="bookingForm" class="p-6 space-y-4">
      
      <!-- Nama -->
      <div>
        <label class="text-xs font-bold uppercase text-slate-500">Nama Panggilan</label>
        <input type="text" id="name" required placeholder="cth: Sarah / Aina"
          class="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-pink-400 outline-none text-sm transition" />
      </div>

      <!-- No Phone -->
      <div>
        <label class="text-xs font-bold uppercase text-slate-500">No. WhatsApp</label>
        <input type="tel" id="phone" required placeholder="cth: 0134567890"
          class="w-full mt-1 p-3 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-pink-400 outline-none text-sm transition" />
      </div>

      <!-- PERUBAHAN 1: Lokasi Pickup (Select Dropdown + Detail Text) -->
      <div class="space-y-2">
        <label class="text-xs font-bold uppercase text-slate-500">Lokasi Pick-up</label>
        
        <!-- Pilihan Kawasan (Kira Harga) -->
        <select id="pickupArea" onchange="calculatePrice()" class="w-full p-3 bg-slate-50 border border-slate-200 rounded-2xl focus:ring-2 focus:ring-pink-400 outline-none text-sm font-semibold transition">
          <optgroup label="🏡 Kawasan RST (Luar Kampus)">
            <option value="rst">Desasiswa Restu</option>
            <option value="rst">Desasiswa Saujana</option>
            <option value="rst">Desasiswa Tekun</option>
          </optgroup>
          <optgroup label="🏫 Kampus Utama">
            <option value="kampus">Desasiswa Aman Damai</option>
            <option value="kampus">Desasiswa Bakti Permai</option>
            <option value="kampus">Desasiswa Cahaya Gemilang</option>
            <option value="kampus">Desasiswa Fajar Harapan</option>
            <option value="kampus">Desasiswa Indah Kembara</option>
            <option value="kampus">Pintu Sg Dua / Bumbung Putih</option>
            <option value="kampus">Lain-lain Kawasan Kampus</option>
          </optgroup>
        </select>

        <!-- Kotak Detail Pick-up -->
        <input type="text" id="pickupDetail" required placeholder="Detail tempat: cth: Foyer Blok B, Bilik 204, Pondok Guard"
          class="w-full p-3 bg-slate-50 border border-pink-100 rounded-2xl focus:ring-2 focus:ring-pink-400 outline-none text-xs transition placeholder-slate-400" />
      </div>

      <!-- Destinasi / Kirim Barang -->
      <div>
        <label class="text-xs font-bold uppercase text-slate-500">Destinasi / Nak Beli Barang Kat Mana?</label>
        <div class="grid grid-cols-2 gap-2 mt-1">
          <label class="cursor-pointer">
            <input type="radio" name="dest" value="diy" checked onchange="calculatePrice()" class="peer sr-only">
            <div class="p-3 text-center text-xs font-bold border-2 border-slate-100 rounded-2xl peer-checked:bg-pink-500 peer-checked:text-white peer-checked:border-pink-500 transition shadow-sm">
              🔨 MR.DIY Sg Dua
            </div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="dest" value="mydin" onchange="calculatePrice()" class="peer sr-only">
            <div class="p-3 text-center text-xs font-bold border-2 border-slate-100 rounded-2xl peer-checked:bg-pink-500 peer-checked:text-white peer-checked:border-pink-500 transition shadow-sm">
              🛍️ Mydin BJ
            </div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="dest" value="eco" onchange="calculatePrice()" class="peer sr-only">
            <div class="p-3 text-center text-xs font-bold border-2 border-slate-100 rounded-2xl peer-checked:bg-pink-500 peer-checked:text-white peer-checked:border-pink-500 transition shadow-sm">
              🟢 Eco-Shop RM2.40
            </div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="dest" value="lotus" onchange="calculatePrice()" class="peer sr-only">
            <div class="p-3 text-center text-xs font-bold border-2 border-slate-100 rounded-2xl peer-checked:bg-pink-500 peer-checked:text-white peer-checked:border-pink-500 transition shadow-sm">
              🛒 Lotus's Sg Dua
            </div>
          </label>
        </div>
      </div>

      <!-- Window Time Slot -->
      <div>
        <label class="text-xs font-bold uppercase text-slate-500">Pilih Slot Masa Runner</label>
        <div class="grid grid-cols-2 gap-2 mt-1">
          <label class="cursor-pointer">
            <input type="radio" name="slot" value="5:00 PM" checked class="peer sr-only">
            <div class="p-3 text-center text-xs font-extrabold border-2 border-slate-100 rounded-2xl peer-checked:bg-amber-300 peer-checked:border-amber-300 peer-checked:text-slate-900 transition">
              ☀️ 5:00 PM (Petang)
            </div>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="slot" value="8:00 PM" class="peer sr-only">
            <div class="p-3 text-center text-xs font-extrabold border-2 border-slate-100 rounded-2xl peer-checked:bg-amber-300 peer-checked:border-amber-300 peer-checked:text-slate-900 transition">
              🌙 8:00 PM (Malam)
            </div>
          </label>
        </div>
      </div>

      <!-- Tambang Box -->
      <div class="bg-pink-50 p-4 rounded-2xl flex justify-between items-center border border-pink-200">
        <div>
          <span class="text-slate-500 text-xs block">Tambang Jimat Sis:</span>
          <span class="text-[11px] text-pink-600 font-semibold">Jimat RM1 - RM2 ikut jarak ✨</span>
        </div>
        <span id="priceTag" class="text-2xl font-black text-pink-600">RM 4.00</span>
      </div>

      <!-- Submit Button -->
      <button type="submit" id="submitBtn" class="w-full py-4 bg-pink-500 hover:bg-pink-600 active:scale-[0.98] text-white font-extrabold rounded-2xl shadow-lg shadow-pink-200 transition duration-150">
        Book Slot Sekarang Sis! 💖
      </button>
    </form>
  </div>

  <!-- Firebase Scripts -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    // ⚠️ GANTIKAN DENGAN CONFIG FIREBASE PROJEK ANDA
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "XXXX",
      appId: "XXXX"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    // Dynamic Price Logic
    window.calculatePrice = function() {
      const pickupArea = document.getElementById('pickupArea').value;
      const dest = document.querySelector('input[name="dest"]:checked').value;
      let price = 4;

      if (dest === 'diy' || dest === 'lotus') {
        price = (pickupArea === 'rst') ? 5 : 4;
      } else if (dest === 'mydin' || dest === 'eco') {
        price = (pickupArea === 'rst') ? 6 : 5;
      }

      document.getElementById('priceTag').innerText = `RM ${price}.00`;
      return price;
    };

    // Submit Booking
    document.getElementById('bookingForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.innerText = "Sila tunggu sekejap ya... ⏳";
      btn.disabled = true;

      const name = document.getElementById('name').value;
      const phone = document.getElementById('phone').value;
      const pickupSelected = document.getElementById('pickupArea').selectedOptions[0].text;
      const pickupDetail = document.getElementById('pickupDetail').value;
      const fullPickup = `${pickupSelected} (${pickupDetail})`;
      
      const dest = document.querySelector('input[name="dest"]:checked').value;
      const slot = document.querySelector('input[name="slot"]:checked').value;
      const fare = calculatePrice();

      try {
        await addDoc(collection(db, "bookings"), {
          name,
          phone,
          pickup: fullPickup,
          destination: dest.toUpperCase(),
          slot,
          fare: `RM ${fare}`,
          status: "Pending",
          createdAt: serverTimestamp()
        });

        alert("Booking Berjaya Sis! Akak akan roger melalui WhatsApp sebentar lagi ya 🌸");
        document.getElementById('bookingForm').reset();
        calculatePrice();
      } catch (err) {
        alert("Ralat! Pastikan anda sambungkan Firestore database.");
        console.error(err);
      } finally {
        btn.innerText = "Book Slot Sekarang Sis! 💖";
        btn.disabled = false;
      }
    });

    calculatePrice();
  </script>
</body>
</html>
